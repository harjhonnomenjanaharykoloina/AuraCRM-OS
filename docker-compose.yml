services:
  db:
    image: postgres:16
    container_name: auracrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auracrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auracrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: auracrm-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # --- Core ---
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/auracrm}
      JWT_SECRET: ${JWT_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_URL: ${FRONTEND_URL:-}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
      NEXT_PUBLIC_APP_LOGO: ${NEXT_PUBLIC_APP_LOGO:-}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-}

      # --- Auth (OAuth) ---
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}

      # --- Encryption ---
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}

      # --- Storage ---
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}

      # --- Email ---
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SES_REGION: ${SES_REGION:-}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_SOURCE_ARN: ${SES_SOURCE_ARN:-}

      # --- AWS / S3 ---
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

      # --- Search ---
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN:-}

      # --- AI ---
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # --- Background jobs (Inngest) ---
      INNGEST_ID: ${INNGEST_ID:-}
      INNGEST_APP_NAME: ${INNGEST_APP_NAME:-}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: auracrm-worker
    restart: unless-stopped
    command: pnpm run jobs:worker
    environment:
      # --- Core ---
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/auracrm}
      JWT_SECRET: ${JWT_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_URL: ${FRONTEND_URL:-}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
      NEXT_PUBLIC_APP_LOGO: ${NEXT_PUBLIC_APP_LOGO:-}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-}

      # --- Auth (OAuth) ---
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}

      # --- Encryption ---
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}

      # --- Storage ---
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}

      # --- Email ---
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SES_REGION: ${SES_REGION:-}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_SOURCE_ARN: ${SES_SOURCE_ARN:-}

      # --- AWS / S3 ---
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

      # --- Search ---
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN:-}

      # --- AI ---
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # --- Background jobs (Inngest) ---
      INNGEST_ID: ${INNGEST_ID:-}
      INNGEST_APP_NAME: ${INNGEST_APP_NAME:-}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
